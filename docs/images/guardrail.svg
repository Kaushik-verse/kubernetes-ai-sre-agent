<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" width="1280" height="470" role="img" aria-labelledby="t d">
  <title id="t">The guardrail: what the agent may and may not run</title>
  <desc id="d">Allowed: scoped kubectl reads and single-object writes in the app namespace. Blocked: non-kubectl programs, shell chaining, deleting namespaces or deployments, bulk flags, scale to zero, exec and drain, and any write during read-only tasks.</desc>
  <defs><pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.2" fill="#1E2A44"/></pattern></defs>
  <rect width="1280" height="470" rx="22" fill="#0B1220"/>
  <rect width="1280" height="470" rx="22" fill="url(#dots)"/>
  <g font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
    <text x="40" y="44" font-size="20" font-weight="800" fill="#E6EDF7">🛡️ Safety is enforced in code, not in the prompt</text>
    <text x="40" y="68" font-size="14" fill="#8FA0BF">Every command the LLM writes passes through one allow-list. There is no shell, so injection tricks have nothing to exploit.</text>

    <!-- allowed -->
    <rect x="40" y="96" width="580" height="330" rx="16" fill="#0C2620" stroke="#1F5145"/>
    <text x="64" y="132" font-size="16" font-weight="800" fill="#6EE7B7">✓ ALLOWED</text>
    <g font-family="Menlo,Consolas,monospace" font-size="13.5" fill="#D1FAE5">
      <text x="64" y="172">kubectl get pods -n hotel-reservation</text>
      <text x="64" y="208">kubectl logs geo-… | grep -i error</text>
      <text x="64" y="244">kubectl describe svc geo -n hotel-…</text>
      <text x="64" y="280">kubectl patch svc geo -n hotel-reservation …</text>
      <text x="64" y="316">kubectl rollout undo deployment/rate -n …</text>
      <text x="64" y="352">kubectl delete pod &lt;one pod&gt; -n …</text>
    </g>
    <text x="64" y="398" font-size="13" fill="#6EE7B7">Writes only in fix tasks · always in the app namespace · one named object</text>

    <!-- blocked -->
    <rect x="660" y="96" width="580" height="330" rx="16" fill="#2A1218" stroke="#5C2530"/>
    <text x="684" y="132" font-size="16" font-weight="800" fill="#FCA5A5">✗ BLOCKED</text>
    <g font-size="13.5">
      <g font-family="Menlo,Consolas,monospace" fill="#FECACA">
        <text x="684" y="172">rm · curl · bash · python</text>
        <text x="684" y="208">… ; …   &amp;&amp;   $( )   &gt; file</text>
        <text x="684" y="244">delete namespace / deployment / svc</text>
        <text x="684" y="280">--all  -A  -l app=…</text>
        <text x="684" y="316">scale … --replicas=0</text>
        <text x="684" y="352">exec · drain · apply · edit</text>
      </g>
      <g fill="#F87171" text-anchor="end" font-size="12">
        <text x="1216" y="172">not kubectl</text><text x="1216" y="208">shell injection</text>
        <text x="1216" y="244">blast radius</text><text x="1216" y="280">bulk action</text>
        <text x="1216" y="316">takes service down</text><text x="1216" y="352">escapes the API</text>
      </g>
    </g>
    <text x="684" y="398" font-size="13" fill="#FCA5A5">+ any write at all during detection or localization</text>

    <text x="640" y="452" font-size="13" fill="#8FA0BF" text-anchor="middle">A blocked command is never executed. The agent is told why, and the cascade escalates to the larger model.</text>
  </g>
</svg>
