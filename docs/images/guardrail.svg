<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="1280" height="380" role="img" aria-labelledby="t d">
  <title id="t">The guardrail: allowed and blocked commands</title>
  <desc id="d">Allowed: kubectl reads and single-object writes in the app namespace. Blocked: other programs, shell chaining, deleting namespaces or deployments, bulk flags, scaling to zero, exec and drain, and any write during read-only tasks.</desc>
  <rect width="1280" height="380" rx="22" fill="#F7F6F2"/>
  <g font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
    <text x="48" y="54" font-family="Georgia,serif" font-size="24" fill="#1A1C1E">Safety lives in code, not in the prompt</text>
    <text x="48" y="80" font-size="14" fill="#5E6368">Commands run as argument lists, never through a shell, so there is nothing to inject into.</text>

    <rect x="48" y="104" width="578" height="236" rx="14" fill="#fff" stroke="#E2DFD6"/>
    <rect x="48" y="104" width="6" height="236" fill="#2F6B4F"/>
    <text x="78" y="138" font-size="13" font-weight="700" fill="#2F6B4F" letter-spacing="1.4">ALLOWED</text>
    <g font-family="Menlo,Consolas,monospace" font-size="13" fill="#1A1C1E">
      <text x="78" y="174">kubectl get pods -n hotel-reservation</text>
      <text x="78" y="202">kubectl logs geo-… | grep -i error</text>
      <text x="78" y="230">kubectl patch svc geo -n hotel-reservation …</text>
      <text x="78" y="258">kubectl rollout undo deployment/rate -n …</text>
      <text x="78" y="286">kubectl delete pod &lt;one pod&gt; -n …</text>
    </g>
    <text x="78" y="320" font-size="12.5" fill="#5E6368">Writes only when fixing, in the app namespace, one named object.</text>

    <rect x="654" y="104" width="578" height="236" rx="14" fill="#fff" stroke="#E2DFD6"/>
    <rect x="654" y="104" width="6" height="236" fill="#B4552D"/>
    <text x="684" y="138" font-size="13" font-weight="700" fill="#B4552D" letter-spacing="1.4">BLOCKED</text>
    <g font-size="13">
      <g font-family="Menlo,Consolas,monospace" fill="#1A1C1E">
        <text x="684" y="174">rm · curl · bash</text>
        <text x="684" y="202">;  &amp;&amp;  $( )  &gt;</text>
        <text x="684" y="230">delete namespace / deployment</text>
        <text x="684" y="258">--all · -A · scale --replicas=0</text>
        <text x="684" y="286">exec · drain · apply · edit</text>
      </g>
      <g fill="#8A8F94" text-anchor="end" font-size="12.5">
        <text x="1206" y="174">not kubectl</text><text x="1206" y="202">shell tricks</text>
        <text x="1206" y="230">too destructive</text><text x="1206" y="258">bulk or outage</text><text x="1206" y="286">bypasses the API</text>
      </g>
    </g>
    <text x="684" y="320" font-size="12.5" fill="#5E6368">Plus any write at all while detecting or localizing.</text>
  </g>
</svg>
