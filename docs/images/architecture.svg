<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 330" width="1280" height="330" role="img" aria-labelledby="t d">
  <title id="t">How OpsPilot works</title>
  <desc id="d">The LLM writes one command, the guardrail checks it, the executor runs it on the simulator or a kind cluster, and the output goes back to the LLM. On submit, a verification gate runs before the automatic scorer.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9A9EA3"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B4552D"/></marker>
  </defs>
  <rect width="1280" height="330" rx="22" fill="#F7F6F2"/>
  <g font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
    <text x="48" y="54" font-family="Georgia,serif" font-size="24" fill="#1A1C1E">Think, act, observe</text>
    <text x="48" y="80" font-size="14" fill="#5E6368">One command per step. Every command is checked before it runs.</text>

    <g stroke="#9A9EA3" stroke-width="1.6" fill="none">
      <path d="M268 160H318" marker-end="url(#a)"/>
      <path d="M528 160H578" marker-end="url(#a)"/>
      <path d="M788 160H838" marker-end="url(#a)"/>
      <path d="M1048 160H1098" marker-end="url(#a)"/>
      <path d="M1170 194V236H423V198" marker-end="url(#a)" stroke-dasharray="5 5"/>
    </g>
    <path d="M683 194V214H463V198" stroke="#B4552D" stroke-width="1.6" fill="none" marker-end="url(#r)"/>
    <text x="573" y="208" font-size="12" fill="#B4552D" text-anchor="middle">blocked, with the reason</text>
    <text x="796" y="254" font-size="12.5" fill="#8A8F94" text-anchor="middle">output goes back to the model (up to 15 steps)</text>

    <g text-anchor="middle">
      <rect x="48" y="126" width="220" height="68" rx="12" fill="#fff" stroke="#E2DFD6"/>
      <text x="158" y="155" font-size="16" font-weight="700" fill="#1A1C1E">Task</text>
      <text x="158" y="177" font-size="12.5" fill="#5E6368">detect · localize · fix</text>

      <rect x="318" y="126" width="210" height="68" rx="12" fill="#fff" stroke="#1E4D8C" stroke-width="1.5"/>
      <text x="423" y="155" font-size="16" font-weight="700" fill="#1A1C1E">LLM</text>
      <text x="423" y="177" font-size="12.5" fill="#5E6368">small, then large</text>

      <rect x="578" y="126" width="210" height="68" rx="12" fill="#fff" stroke="#B4552D" stroke-width="1.5"/>
      <text x="683" y="155" font-size="16" font-weight="700" fill="#1A1C1E">Guardrail</text>
      <text x="683" y="177" font-size="12.5" fill="#5E6368">allow-list policy</text>

      <rect x="838" y="126" width="210" height="68" rx="12" fill="#fff" stroke="#E2DFD6"/>
      <text x="943" y="155" font-size="16" font-weight="700" fill="#1A1C1E">Executor</text>
      <text x="943" y="177" font-size="12.5" fill="#5E6368">no shell</text>

      <rect x="1098" y="126" width="140" height="68" rx="12" fill="#fff" stroke="#E2DFD6"/>
      <text x="1168" y="155" font-size="16" font-weight="700" fill="#1A1C1E">Cluster</text>
      <text x="1168" y="177" font-size="12.5" fill="#5E6368">sim or kind</text>
    </g>

    <g transform="translate(48 274)">
      <rect width="1190" height="34" rx="17" fill="#fff" stroke="#E2DFD6"/>
      <text x="22" y="22" font-size="13.5" fill="#1A1C1E"><tspan font-weight="700">submit</tspan><tspan fill="#9A9EA3">  →  </tspan><tspan font-weight="700" fill="#1E4D8C">verification gate</tspan><tspan fill="#5E6368">  pods ready, endpoints correct, evidence gathered</tspan><tspan fill="#9A9EA3">  →  </tspan><tspan font-weight="700" fill="#2F6B4F">automatic scorer</tspan><tspan fill="#5E6368">  checks the real cluster, not the agent's word</tspan></text>
    </g>
  </g>
</svg>
