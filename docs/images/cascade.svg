<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 330" width="1280" height="330" role="img" aria-labelledby="t d">
  <title id="t">The model cascade: small model first, large model when stuck</title>
  <desc id="d">The small gpt-oss-20b model handles steps until a trigger fires: a format error, a blocked command, a repeated command, a submit without a fix, or the step budget. Then gpt-oss-120b takes over. In the benchmark it escalated in 7 of 16 episodes.</desc>
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.2" fill="#1E2A44"/></pattern>
    <linearGradient id="flow" x1="0" x2="1"><stop offset="0" stop-color="#38BDF8"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
  </defs>
  <rect width="1280" height="330" rx="22" fill="#0B1220"/>
  <rect width="1280" height="330" rx="22" fill="url(#dots)"/>
  <g font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
    <text x="40" y="44" font-size="20" font-weight="800" fill="#E6EDF7">💰 Ask the classmate before the teacher</text>
    <text x="40" y="68" font-size="14" fill="#8FA0BF">A cost-aware cascade in the spirit of FrugalGPT and RouteLLM, driven by behaviour, not by a trained router.</text>

    <g text-anchor="middle">
      <rect x="40" y="104" width="300" height="140" rx="18" fill="#0E2238" stroke="#38BDF8"/>
      <text x="190" y="150" font-size="38">🐣</text>
      <text x="190" y="186" font-size="18" font-weight="800" fill="#E6EDF7">gpt-oss-20b</text>
      <text x="190" y="210" font-size="13" fill="#7DD3FC">small · cheap · fast</text>
      <text x="190" y="230" font-size="12" fill="#8FA0BF">starts every incident</text>

      <rect x="940" y="104" width="300" height="140" rx="18" fill="#1E1838" stroke="#A78BFA"/>
      <text x="1090" y="150" font-size="38">🦉</text>
      <text x="1090" y="186" font-size="18" font-weight="800" fill="#E6EDF7">gpt-oss-120b</text>
      <text x="1090" y="210" font-size="13" fill="#C4B5FD">large · smarter · costlier</text>
      <text x="1090" y="230" font-size="12" fill="#8FA0BF">takes over when needed</text>
    </g>

    <path d="M346 174H932" stroke="url(#flow)" stroke-width="3" stroke-dasharray="10 8">
      <animate attributeName="stroke-dashoffset" values="36;0" dur="1s" repeatCount="indefinite"/></path>
    <path d="M922 166l12 8-12 8z" fill="#A78BFA"/>
    <text x="640" y="108" font-size="13" font-weight="700" fill="#E6EDF7" text-anchor="middle" letter-spacing="1.2">ESCALATE WHEN THE SMALL MODEL…</text>

    <g font-size="12.5" font-weight="700" text-anchor="middle">
      <rect x="372" y="126" width="168" height="30" rx="15" fill="#13213D" stroke="#2B3A5C"/><text x="456" y="146" fill="#CBD5E1">✎ breaks the format</text>
      <rect x="556" y="126" width="168" height="30" rx="15" fill="#13213D" stroke="#2B3A5C"/><text x="640" y="146" fill="#CBD5E1">🛡️ gets blocked</text>
      <rect x="740" y="126" width="168" height="30" rx="15" fill="#13213D" stroke="#2B3A5C"/><text x="824" y="146" fill="#CBD5E1">↻ repeats a command</text>
      <rect x="440" y="194" width="196" height="30" rx="15" fill="#13213D" stroke="#2B3A5C"/><text x="538" y="214" fill="#CBD5E1">✋ "fixed" with no change</text>
      <rect x="652" y="194" width="196" height="30" rx="15" fill="#13213D" stroke="#2B3A5C"/><text x="750" y="214" fill="#CBD5E1">⏱ uses 8 steps</text>
    </g>

    <g transform="translate(40 268)">
      <rect width="1200" height="42" rx="12" fill="#131D33" stroke="#2B3A5C"/>
      <g font-size="14" font-weight="700">
        <text x="24" y="27" fill="#8FA0BF">In the benchmark</text>
        <text x="190" y="27" fill="#7DD3FC">escalated in 7 of 16 incidents</text>
        <text x="470" y="27" fill="#4B5E86">·</text>
        <text x="492" y="27" fill="#FCD34D">only 36% of tokens went to the big model</text>
        <text x="850" y="27" fill="#4B5E86">·</text>
        <text x="872" y="27" fill="#6EE7B7">no training, no extra model</text>
      </g>
    </g>
  </g>
</svg>
