<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="t d">
  <title id="t">Results</title>
  <desc id="d">Incidents solved: cascade 94%, cascade without gates 94%, large only 100%, small only 94%. Large-model tokens per incident: cascade about 4.5 thousand, without gates about 3.9 thousand, large only 14.6 thousand, small only zero.</desc>
  <rect width="1280" height="360" rx="22" fill="#F7F6F2"/>
  <g font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
    <text x="48" y="54" font-family="Georgia,serif" font-size="24" fill="#1A1C1E">Close to the large model, at a third of its cost</text>
    <text x="48" y="80" font-size="14" fill="#5E6368">16 episodes on the simulator, free-tier Groq, single runs.</text>

    <g font-size="12" font-weight="700" fill="#8A8F94" letter-spacing="1.2">
      <text x="260" y="122">INCIDENTS SOLVED</text><text x="790" y="122">LARGE-MODEL TOKENS PER INCIDENT</text>
    </g>
    <g font-size="14.5" fill="#1A1C1E">
      <text x="48" y="164" font-weight="700">OpsPilot cascade</text>
      <text x="48" y="208">cascade, no gates</text>
      <text x="48" y="252">large model only</text>
      <text x="48" y="296">small model only</text>
    </g>
    <g fill="#E6E3DB">
      <rect x="260" y="152" width="400" height="16" rx="8"/><rect x="260" y="196" width="400" height="16" rx="8"/>
      <rect x="260" y="240" width="400" height="16" rx="8"/><rect x="260" y="284" width="400" height="16" rx="8"/>
      <rect x="790" y="152" width="380" height="16" rx="8"/><rect x="790" y="196" width="380" height="16" rx="8"/>
      <rect x="790" y="240" width="380" height="16" rx="8"/><rect x="790" y="284" width="380" height="16" rx="8"/>
    </g>
    <rect x="260" y="152" width="376" height="16" rx="8" fill="#1E4D8C"/>
    <g fill="#9DB3CF">
      <rect x="260" y="196" width="376" height="16" rx="8"/><rect x="260" y="240" width="400" height="16" rx="8"/><rect x="260" y="284" width="376" height="16" rx="8"/>
    </g>
    <rect x="790" y="152" width="117" height="16" rx="8" fill="#1E4D8C"/>
    <rect x="790" y="196" width="101" height="16" rx="8" fill="#9DB3CF"/>
    <rect x="790" y="240" width="380" height="16" rx="8" fill="#B4552D"/>
    <g font-size="14" font-weight="700" fill="#1A1C1E">
      <text x="676" y="166">94%</text><text x="676" y="210">94%</text><text x="676" y="254">100%</text><text x="676" y="298">94%</text>
      <text x="1184" y="166">4.5k</text><text x="1184" y="210">3.9k</text><text x="1184" y="254">14.6k</text><text x="1184" y="298">0</text>
    </g>
    <text x="48" y="336" font-size="12.5" fill="#5E6368">On this small set the small model alone also reaches 94%, and the verification gates don't change accuracy. Harder scenarios are the next test.</text>
  </g>
</svg>
