<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="t d">
  <title id="t">Benchmark results</title>
  <desc id="d">Incidents solved: cascade 94%, cascade without gates 94%, large only 100%, small only 94%. Large-model tokens per incident: cascade about 4.5 thousand, cascade without gates about 3.9 thousand, large only 14.6 thousand, small only zero.</desc>
  <defs><pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.2" fill="#1E2A44"/></pattern></defs>
  <rect width="1280" height="420" rx="22" fill="#0B1220"/>
  <rect width="1280" height="420" rx="22" fill="url(#dots)"/>
  <g font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
    <text x="40" y="44" font-size="20" font-weight="800" fill="#E6EDF7">📊 Nearly the big model's accuracy, a third of its big-model bill</text>
    <text x="40" y="68" font-size="14" fill="#8FA0BF">16 episodes on the simulator · free-tier Groq · single runs</text>

    <text x="250" y="110" font-size="13" font-weight="800" fill="#8FA0BF" letter-spacing="1.2">INCIDENTS SOLVED ↑</text>
    <text x="790" y="110" font-size="13" font-weight="800" fill="#8FA0BF" letter-spacing="1.2">LARGE-MODEL TOKENS / INCIDENT ↓</text>

    <!-- labels -->
    <g font-size="14.5" font-weight="700" fill="#E6EDF7">
      <text x="40" y="153">🛠️ OpsPilot cascade</text>
      <text x="40" y="209" fill="#CBD5E1">cascade, no gates</text>
      <text x="40" y="265" fill="#CBD5E1">🦉 large only</text>
      <text x="40" y="321" fill="#CBD5E1">🐣 small only</text>
    </g>
    <rect x="30" y="126" width="1220" height="40" rx="10" fill="#38BDF8" fill-opacity=".07"/>

    <!-- solved bars: 100% = 400px -->
    <g>
      <rect x="250" y="136" width="400" height="20" rx="6" fill="#131D33"/><rect x="250" y="136" width="376" height="20" rx="6" fill="#34D399"/>
      <rect x="250" y="192" width="400" height="20" rx="6" fill="#131D33"/><rect x="250" y="192" width="376" height="20" rx="6" fill="#34D399" fill-opacity=".55"/>
      <rect x="250" y="248" width="400" height="20" rx="6" fill="#131D33"/><rect x="250" y="248" width="400" height="20" rx="6" fill="#34D399" fill-opacity=".55"/>
      <rect x="250" y="304" width="400" height="20" rx="6" fill="#131D33"/><rect x="250" y="304" width="376" height="20" rx="6" fill="#34D399" fill-opacity=".55"/>
    </g>
    <g font-size="14" font-weight="800" fill="#E6EDF7" text-anchor="end">
      <text x="736" y="152">94%</text><text x="736" y="208">94%</text><text x="736" y="264">100%</text><text x="736" y="320">94%*</text>
    </g>

    <!-- token bars: 14.6k = 400px -->
    <g>
      <rect x="790" y="136" width="400" height="20" rx="6" fill="#131D33"/><rect x="790" y="136" width="123" height="20" rx="6" fill="#FBBF24"/>
      <rect x="790" y="192" width="400" height="20" rx="6" fill="#131D33"/><rect x="790" y="192" width="107" height="20" rx="6" fill="#FBBF24" fill-opacity=".55"/>
      <rect x="790" y="248" width="400" height="20" rx="6" fill="#131D33"/><rect x="790" y="248" width="400" height="20" rx="6" fill="#F87171" fill-opacity=".75"/>
      <rect x="790" y="304" width="400" height="20" rx="6" fill="#131D33"/>
    </g>
    <g font-size="14" font-weight="800" fill="#E6EDF7">
      <text x="925" y="152">~4.5k</text><text x="909" y="208">~3.9k</text><text x="1202" y="264">14.6k</text><text x="802" y="320">0</text>
    </g>

    <g transform="translate(40 350)">
      <rect width="1200" height="50" rx="12" fill="#131D33" stroke="#2B3A5C"/>
      <text x="24" y="22" font-size="13.5" font-weight="700" fill="#FCD34D">Honest reading</text>
      <text x="24" y="40" font-size="12.5" fill="#8FA0BF">The cascade cuts big-model tokens by 69% vs large-only. On this easy set small-only also hits 94% (*after re-running 5 rate-limited episodes), and the gates don't change accuracy. Harder scenarios are next.</text>
    </g>
  </g>
</svg>
