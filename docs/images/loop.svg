<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t d">
  <title id="t">How OpsPilot works: the ReAct loop</title>
  <desc id="d">Task, then the LLM thinks and writes one command, the guardrail checks it, the executor runs it without a shell on the simulator or a kind cluster, and the observation goes back to the LLM. On submit, a verification gate checks the work before the automatic scorer.</desc>
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.2" fill="#1E2A44"/></pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4B5E86"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#F87171"/></marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34D399"/></marker>
  </defs>
  <rect width="1280" height="400" rx="22" fill="#0B1220"/>
  <rect width="1280" height="400" rx="22" fill="url(#dots)"/>
  <g font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
    <text x="40" y="44" font-size="20" font-weight="800" fill="#E6EDF7">Think → act → observe, until it's fixed</text>
    <text x="40" y="68" font-size="14" fill="#8FA0BF">The ReAct loop, with a safety check on every action and a double-check before "done".</text>

    <!-- loop path -->
    <path d="M300 190H352" stroke="#4B5E86" stroke-width="2.5" marker-end="url(#ar)"/>
    <path d="M548 190H600" stroke="#4B5E86" stroke-width="2.5" marker-end="url(#ar)"/>
    <path d="M796 190H848" stroke="#34D399" stroke-width="2.5" marker-end="url(#arg)"/>
    <path d="M946 232V300H460V236" stroke="#4B5E86" stroke-width="2.5" fill="none" marker-end="url(#ar)" stroke-dasharray="7 6">
      <animate attributeName="stroke-dashoffset" values="26;0" dur="1.2s" repeatCount="indefinite"/></path>
    <path d="M698 232V262" stroke="#F87171" stroke-width="2" fill="none"/>
    <path d="M698 262H500V240" stroke="#F87171" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <text x="600" y="256" font-size="12" fill="#FCA5A5" text-anchor="middle">blocked → explained to the agent</text>
    <text x="703" y="322" font-size="13" fill="#8FA0BF" text-anchor="middle">↺ observation goes back into the context · max 15 steps</text>

    <!-- nodes -->
    <g text-anchor="middle">
      <rect x="60" y="148" width="240" height="84" rx="14" fill="#131D33" stroke="#2B3A5C"/>
      <text x="180" y="182" font-size="16" font-weight="800" fill="#E6EDF7">📋 Task</text>
      <text x="180" y="206" font-size="12.5" fill="#8FA0BF">"Something is wrong. Fix it."</text>

      <rect x="352" y="148" width="196" height="84" rx="14" fill="#1E1838" stroke="#A78BFA"/>
      <text x="450" y="182" font-size="16" font-weight="800" fill="#E6EDF7">🧠 LLM</text>
      <text x="450" y="206" font-size="12.5" fill="#C4B5FD">1 thought + 1 command</text>

      <rect x="600" y="148" width="196" height="84" rx="14" fill="#2A1520" stroke="#F87171"/>
      <text x="698" y="182" font-size="16" font-weight="800" fill="#E6EDF7">🛡️ Guardrail</text>
      <text x="698" y="206" font-size="12.5" fill="#FCA5A5">allow-list · scoped writes</text>

      <rect x="848" y="148" width="196" height="84" rx="14" fill="#0F2A24" stroke="#34D399"/>
      <text x="946" y="182" font-size="16" font-weight="800" fill="#E6EDF7">⚡ Executor</text>
      <text x="946" y="206" font-size="12.5" fill="#6EE7B7">argv only · no shell</text>
    </g>

    <!-- cluster + submit -->
    <g text-anchor="middle">
      <path d="M1044 190H1080" stroke="#34D399" stroke-width="2.5" marker-end="url(#arg)"/>
      <rect x="1082" y="132" width="170" height="116" rx="14" fill="#0E2238" stroke="#38BDF8"/>
      <text x="1167" y="168" font-size="15" font-weight="800" fill="#E6EDF7">☸️ Cluster</text>
      <text x="1167" y="192" font-size="12.5" fill="#7DD3FC">simulator</text>
      <text x="1167" y="210" font-size="12.5" fill="#7DD3FC">or real kind</text>
    </g>

    <g transform="translate(60 346)" font-size="13.5" font-weight="700">
      <rect width="1160" height="38" rx="10" fill="#131D33" stroke="#2B3A5C"/>
      <text x="20" y="25" fill="#C4B5FD">submit(...)</text>
      <text x="118" y="25" fill="#4B5E86">→</text>
      <text x="142" y="25" fill="#FCD34D">✔ verification gate</text>
      <text x="300" y="25" fill="#8FA0BF" font-weight="500">pods Ready? endpoints right? evidence checked?</text>
      <text x="676" y="25" fill="#4B5E86">→</text>
      <text x="700" y="25" fill="#6EE7B7">🏁 automatic scorer</text>
      <text x="862" y="25" fill="#8FA0BF" font-weight="500">checks real cluster health, not the agent's word</text>
    </g>
  </g>
</svg>
