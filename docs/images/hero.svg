<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" width="1280" height="460" role="img" aria-labelledby="t d">
  <title id="t">OpsPilot: an AI on-call engineer for Kubernetes</title>
  <desc id="d">A sample incident: the agent investigates with kubectl, an unsafe command is blocked, the large model takes over, applies the fix and verifies it.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#E8E6DF"/></pattern>
    <linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#F7F6F2"/><stop offset=".5" stop-color="#F7F6F2" stop-opacity=".25"/><stop offset="1" stop-color="#F7F6F2" stop-opacity="0"/></linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1A1C1E" flood-opacity=".09"/></filter>
  </defs>
  <rect width="1280" height="460" rx="22" fill="#F7F6F2"/>
  <rect width="1280" height="460" rx="22" fill="url(#grid)"/>
  <rect width="1280" height="460" rx="22" fill="url(#fade)"/>
  <g font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
    <g transform="translate(72 74)">
      <circle cx="18" cy="18" r="16" fill="none" stroke="#1E4D8C" stroke-width="2.5"/>
      <path d="M18 8l6.5 15L18 19.5 11.5 23z" fill="#1E4D8C"/>
      <text x="48" y="27" font-family="Georgia,'Times New Roman',serif" font-size="30" font-weight="700" fill="#1A1C1E">OpsPilot</text>
      <text x="190" y="26" font-size="13" font-weight="600" fill="#B4552D" letter-spacing="1.5">AI SRE AGENT FOR KUBERNETES</text>
    </g>
    <text x="72" y="192" font-family="Georgia,'Times New Roman',serif" font-size="54" fill="#1A1C1E">The on-call engineer</text>
    <text x="72" y="254" font-family="Georgia,'Times New Roman',serif" font-size="54" fill="#1A1C1E" font-style="italic">that never sleeps.</text>
    <text x="72" y="302" font-size="19" fill="#5E6368">Detects, localizes and fixes Kubernetes incidents on free-tier LLMs.</text>
    <text x="72" y="330" font-size="19" fill="#5E6368">Every command is checked. The large model only when needed.</text>
    <g font-size="14" font-weight="600" transform="translate(72 366)">
      <rect width="104" height="32" rx="16" fill="#1E4D8C"/><text x="52" y="21" fill="#fff" text-anchor="middle">Agentic AI</text>
      <rect x="114" width="112" height="32" rx="16" fill="#fff" stroke="#D6D3CA"/><text x="170" y="21" fill="#1A1C1E" text-anchor="middle">Kubernetes</text>
      <rect x="236" width="104" height="32" rx="16" fill="#fff" stroke="#D6D3CA"/><text x="288" y="21" fill="#1A1C1E" text-anchor="middle">Guardrails</text>
      <rect x="350" width="122" height="32" rx="16" fill="#fff" stroke="#D6D3CA"/><text x="411" y="21" fill="#1A1C1E" text-anchor="middle">Free-tier LLMs</text>
    </g>

    <g transform="translate(724 64)" filter="url(#sh)">
      <rect width="492" height="332" rx="14" fill="#fff" stroke="#E2DFD6"/>
      <path d="M0 14a14 14 0 0 1 14-14h464a14 14 0 0 1 14 14v24H0z" fill="#F1EFE9"/>
      <circle cx="20" cy="19" r="5" fill="#D6D3CA"/><circle cx="37" cy="19" r="5" fill="#D6D3CA"/><circle cx="54" cy="19" r="5" fill="#D6D3CA"/>
      <text x="246" y="24" font-size="12" fill="#8A8F94" text-anchor="middle">incident · target_port · mitigation</text>
      <g font-family="Menlo,Consolas,monospace" font-size="13">
        <text x="22" y="72" fill="#5E6368">small</text><text x="86" y="72" fill="#1A1C1E">kubectl get pods</text><text x="470" y="72" fill="#2F6B4F" text-anchor="end">read</text>
        <text x="86" y="92" fill="#8A8F94">all pods Running</text>
        <text x="22" y="124" fill="#5E6368">small</text><text x="86" y="124" fill="#1A1C1E">kubectl get endpoints</text><text x="470" y="124" fill="#2F6B4F" text-anchor="end">read</text>
        <text x="86" y="144" fill="#B4552D">geo: no endpoints on its port</text>
        <text x="22" y="176" fill="#5E6368">small</text><text x="86" y="176" fill="#1A1C1E">kubectl delete deploy geo</text><text x="470" y="176" fill="#B4552D" text-anchor="end" font-weight="700">blocked</text>
        <text x="22" y="208" fill="#1E4D8C">escalate to the large model</text>
        <text x="22" y="240" fill="#5E6368">large</text><text x="86" y="240" fill="#1A1C1E">kubectl patch svc geo …</text><text x="470" y="240" fill="#1E4D8C" text-anchor="end">write</text>
        <text x="22" y="272" fill="#5E6368">check</text><text x="86" y="272" fill="#1A1C1E">pods ready · endpoints ok</text>
        <line x1="22" y1="292" x2="470" y2="292" stroke="#ECEAE3"/>
        <text x="22" y="316" fill="#2F6B4F" font-weight="700">resolved</text><text x="470" y="316" fill="#8A8F94" text-anchor="end">sample run</text>
      </g>
    </g>
  </g>
</svg>
