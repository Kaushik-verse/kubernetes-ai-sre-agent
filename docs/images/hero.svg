<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" width="1280" height="520" role="img" aria-labelledby="t d">
  <title id="t">OpsPilot: an AI on-call engineer for Kubernetes</title>
  <desc id="d">A sample incident: the agent investigates with kubectl, an unsafe command is blocked, the model escalates, the fix is applied and verified.</desc>
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.2" fill="#1E2A44"/></pattern>
    <radialGradient id="glow" cx="78%" cy="40%" r="60%"><stop offset="0" stop-color="#38BDF8" stop-opacity=".22"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2" cx="10%" cy="100%" r="55%"><stop offset="0" stop-color="#A78BFA" stop-opacity=".18"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".45"/></filter>
    <linearGradient id="title" x1="0" x2="1"><stop offset="0" stop-color="#E6EDF7"/><stop offset="1" stop-color="#7DD3FC"/></linearGradient>
  </defs>
  <rect width="1280" height="520" rx="24" fill="#0B1220"/>
  <rect width="1280" height="520" rx="24" fill="url(#dots)"/>
  <rect width="1280" height="520" rx="24" fill="url(#glow)"/>
  <rect width="1280" height="520" rx="24" fill="url(#glow2)"/>

  <g font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
    <!-- logo -->
    <g transform="translate(64 70)">
      <circle cx="22" cy="22" r="21" fill="none" stroke="#38BDF8" stroke-width="2.5"/>
      <g stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round">
        <path d="M22 1v7M22 36v7M1 22h7M36 22h7M7 7l5 5M32 32l5 5M37 7l-5 5M12 32l-5 5"/>
      </g>
      <path d="M22 12l7 15-7-4-7 4z" fill="#38BDF8"/>
      <text x="58" y="31" font-size="30" font-weight="800" fill="#E6EDF7" letter-spacing="-.5">OpsPilot</text>
      <rect x="198" y="8" width="150" height="26" rx="13" fill="#38BDF8" fill-opacity=".12" stroke="#38BDF8" stroke-opacity=".5"/>
      <text x="273" y="26" font-size="12" font-weight="700" fill="#7DD3FC" text-anchor="middle" letter-spacing="1.4">AGENTIC  AIOPS</text>
    </g>

    <text x="64" y="208" font-size="50" font-weight="800" fill="url(#title)" letter-spacing="-1">The on-call engineer</text>
    <text x="64" y="266" font-size="50" font-weight="800" fill="url(#title)" letter-spacing="-1">that never sleeps</text>
    <text x="64" y="320" font-size="21" fill="#8FA0BF">…and never runs <tspan font-family="Menlo,Consolas,monospace" fill="#F87171">rm -rf</tspan>.</text>
    <text x="64" y="364" font-size="17" fill="#8FA0BF">Detects, localizes and fixes Kubernetes incidents with free-tier LLMs.</text>
    <text x="64" y="390" font-size="17" fill="#8FA0BF">Every command is checked by a guardrail. Big model only when needed.</text>

    <g font-size="13" font-weight="700" transform="translate(64 428)">
      <rect width="118" height="34" rx="17" fill="#34D399" fill-opacity=".14" stroke="#34D399" stroke-opacity=".6"/><text x="59" y="22" fill="#6EE7B7" text-anchor="middle">94% solved</text>
      <rect x="130" width="182" height="34" rx="17" fill="#FBBF24" fill-opacity=".12" stroke="#FBBF24" stroke-opacity=".6"/><text x="221" y="22" fill="#FCD34D" text-anchor="middle">−69% big-model tokens</text>
      <rect x="324" width="152" height="34" rx="17" fill="#F87171" fill-opacity=".12" stroke="#F87171" stroke-opacity=".6"/><text x="400" y="22" fill="#FCA5A5" text-anchor="middle">0 unsafe commands</text>
    </g>

    <!-- terminal -->
    <g transform="translate(676 66)" filter="url(#sh)">
      <rect width="548" height="392" rx="16" fill="#0F172A" stroke="#22304D"/>
      <path d="M0 16a16 16 0 0 1 16-16h516a16 16 0 0 1 16 16v26H0z" fill="#131D33"/>
      <circle cx="22" cy="21" r="6" fill="#F87171"/><circle cx="42" cy="21" r="6" fill="#FBBF24"/><circle cx="62" cy="21" r="6" fill="#34D399"/>
      <text x="274" y="26" font-size="12.5" fill="#8FA0BF" text-anchor="middle">opspilot run --scenario target_port --task mitigation</text>

      <g font-family="Menlo,Consolas,monospace" font-size="13.5">
        <g>
          <text x="22" y="76" fill="#FCA5A5">🚨 incident  hotel-reservation · users can't search hotels</text></g>
        <g>
          <text x="22" y="110" fill="#7DD3FC">🐣 20b ›</text><text x="102" y="110" fill="#E6EDF7">kubectl get pods</text><text x="526" y="110" fill="#34D399" text-anchor="end">✓ read</text>
          <text x="102" y="130" fill="#64748B">all 14 pods 1/1 Running … looks green</text></g>
        <g>
          <text x="22" y="162" fill="#7DD3FC">🐣 20b ›</text><text x="102" y="162" fill="#E6EDF7">kubectl get endpoints</text><text x="526" y="162" fill="#34D399" text-anchor="end">✓ read</text>
          <text x="102" y="182" fill="#FBBF24">geo → wrong port, traffic goes nowhere</text></g>
        <g>
          <text x="22" y="214" fill="#7DD3FC">🐣 20b ›</text><text x="102" y="214" fill="#E6EDF7">kubectl delete deploy geo</text>
          <rect x="430" y="200" width="96" height="20" rx="4" fill="#F87171" fill-opacity=".18"/><text x="478" y="214" fill="#FCA5A5" text-anchor="middle" font-weight="700">✗ BLOCKED</text></g>
        <g>
          <text x="22" y="246" fill="#A78BFA">⤴ escalate → gpt-oss-120b  (reason: guardrail block)</text></g>
        <g>
          <text x="22" y="278" fill="#C4B5FD">🦉 120b›</text><text x="102" y="278" fill="#E6EDF7">kubectl patch svc geo … 8083</text><text x="526" y="278" fill="#FBBF24" text-anchor="end">✓ write</text></g>
        <g>
          <text x="22" y="310" fill="#8FA0BF">✔ verify  pods Ready · endpoints on the right port</text></g>
        <g>
          <rect x="22" y="330" width="504" height="38" rx="8" fill="#34D399" fill-opacity=".14" stroke="#34D399" stroke-opacity=".5"/>
          <text x="274" y="355" fill="#6EE7B7" text-anchor="middle" font-weight="700">RESOLVED · cluster healthy</text></g>
        <rect x="22" y="378" width="9" height="3" fill="#7DD3FC"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
      </g>
    </g>
    <text x="950" y="490" font-size="12" fill="#475569" text-anchor="middle">illustrative incident, based on the target_port scenario</text>
  </g>
</svg>
